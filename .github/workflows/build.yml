name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

- name: Find project folder
        run: |
          F=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n1)
          if [ -z "$F" ] && [ -f BiswastoPay-SMS-App.zip ]; then
            echo "Extracting BiswastoPay-SMS-App.zip"
            mkdir -p _src && unzip -q -o BiswastoPay-SMS-App.zip -d _src
            F=$(find _src -name settings.gradle.kts | head -n1)
          fi
          if [ -z "$F" ]; then echo "settings.gradle.kts not found - upload all project files"; ls -la; exit 1; fi
          echo "PROJ=$(dirname "$F")" >> $GITHUB_ENV
          echo "Project folder: $(dirname "$F")"

      - name: Build release APK
        run: cd "$PROJ" && gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp "$PROJ/app/build/outputs/apk/release/app-release.apk" BiswastoPay-SMS-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BiswastoPay-SMS-APK
          path: BiswastoPay-SMS-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Biswasto Pay SMS v1.0.${{ github.run_number }}
          files: BiswastoPay-SMS-*.apk
