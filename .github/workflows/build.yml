name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1'

      - name: Extract and Build
        run: |
          mkdir project
          unzip -q "resellic-sms-apk-checked-fixed.zip" -d project
          ROOT=$(find project -type f -name settings.gradle.kts -print -quit | xargs dirname)
          cd "$ROOT"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resellic-debug-apk
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
